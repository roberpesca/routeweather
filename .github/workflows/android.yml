name: Build Android app

# Run it by hand: GitHub -> Actions tab -> "Build Android app" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version number (whole number, must be higher than the last upload to Google Play)"
        default: "1"
      version_name:
        description: "Version label shown to people (e.g. 1.0.0)"
        default: "1.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app tools
        working-directory: mobile
        run: npm install

      - name: Copy the web app into the phone app
        working-directory: mobile
        run: npm run prepare-web

      - name: Create the Android project (only done on the build robot)
        working-directory: mobile
        env:
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_B64" | tr -d " \r\n" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/release.keystore"
          fi
          npm run add-android
          npx cap sync android

      - name: Build a test APK (installable on any Android phone)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Build the Google Play file (.aab) — only when the signing key is set up
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: routeweather-android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
